<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f7fbf4;font-family:"Lato",sans-serif;color:#2d3748;min-height:100vh;padding-bottom:56px;}
h1,h2,h3,h4{font-family:"Raleway",sans-serif;text-align:center;}
.fade-in{animation:fi 0.45s ease forwards;}
@keyframes fi{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.card{background:#eaf4e3;border:1px solid #4a7c59;border-radius:5px;padding:20px 22px;margin-bottom:18px;}
.likert-btn{cursor:pointer;border:1px solid #4a7c59;border-radius:5px;padding:10px 2px;font-family:"Lato",sans-serif;font-size:0.76rem;background:#fff;color:#2d3748;transition:all 0.15s ease;text-align:center;width:100%;}
.likert-btn:hover{background:#4CAF50;color:#fff;border-color:#3e8e41;}
.likert-btn.sel{background:#4a7c59;color:#fff;border-color:#013220;font-weight:700;}
.likert-btn.na{border-color:#b0cfa8;color:#6a8a6b;font-size:0.7rem;}
.likert-btn.na.sel{background:#7ec850;border-color:#4a7c59;color:#013220;}
.cta{background:#4CAF50;color:#fff;border:none;border-radius:5px;padding:12px 24px;font-family:"Raleway",sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;letter-spacing:0.04em;transition:background 0.2s;display:flex;align-items:center;gap:6px;}
.cta:hover{background:#3e8e41;}
.cta:disabled{background:#b0cfa8;cursor:not-allowed;}
.cta-outline{background:transparent;color:#4a7c59;border:2px solid #4a7c59;border-radius:5px;padding:11px 22px;font-family:"Raleway",sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;letter-spacing:0.04em;transition:all 0.2s;}
.cta-outline:hover{background:#4a7c59;color:#fff;}
.pb{height:5px;background:#d5e8cc;border-radius:3px;overflow:hidden;}
.pbf{height:100%;background:linear-gradient(90deg,#4a7c59,#4CAF50);border-radius:3px;transition:width 0.4s ease;}
.nbox{border-left:4px solid #4CAF50;background:#fff;border-radius:0 5px 5px 0;padding:13px 15px;margin-bottom:12px;}
.slbl{font-family:"Raleway",sans-serif;font-weight:600;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:#4a7c59;margin-bottom:5px;}
.qi{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #d5e8cc;}
.qi:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.rbb{height:7px;background:#d5e8cc;border-radius:4px;overflow:hidden;margin-top:4px;}
.rbf{height:100%;border-radius:4px;transition:width 1s ease;}
.tbtn{cursor:pointer;border:none;outline:none;transition:all 0.15s;font-family:"Raleway",sans-serif;}
.sfoot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #cccccc;z-index:100;padding:7px 16px;}
.sfoot-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.fcard{background:#eaf4e3;border:1px solid #4a7c59;border-radius:5px;padding:16px 18px;margin-bottom:12px;}
.action-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:24px;margin-bottom:8px;}
.email-panel{background:#fff;border:1px solid #4a7c59;border-radius:5px;padding:16px 18px;margin-top:14px;}
.email-input{width:100%;border:1px solid #b0cfa8;border-radius:5px;padding:10px 12px;font-family:"Lato",sans-serif;font-size:0.88rem;color:#2d3748;outline:none;transition:border 0.2s;}
.email-input:focus{border-color:#4a7c59;}
@media print{
  .sfoot,.no-print{display:none!important;}
  body{padding-bottom:0;}
  .card,.fcard{break-inside:avoid;}
  .print-header{display:block!important;}
}
.print-header{display:none;text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #4a7c59;}
</style>
</head>

const CATS = [
  {id:1,title:"Intersectional Processing Dynamics",hasNA:false,items:[
    {id:"1.1",text:"I desperately want to start new projects or explore exciting ideas, but something in me refuses to begin unless the conditions, order, or environment feel exactly right \u2014 so I end up doing neither."},
    {id:"1.1b",text:"I spend an immense amount of energy creating the \u201cperfect\u201d schedule, organizational system, or routine because I desperately need predictability to feel safe \u2014 only to abandon, forget, or ignore it almost immediately because my brain finds it suffocating or gets pulled somewhere else entirely."},
    {id:"1.2",text:"I can sink deeply into something I care about, but the moment the topic shifts or someone interrupts, I experience a disproportionate internal jolt \u2014 almost like a physical collision \u2014 even if I don\u2019t show it outwardly."},
    {id:"1.2b",text:"I have deep, long-term subjects or hobbies that feel like a core part of who I am, but my mind constantly pulls me toward shiny new, short-term fixations \u2014 leaving me frustrated that I can\u2019t maintain consistent focus on the things I love most."},
    {id:"1.3",text:"I make impulsive decisions quickly and then immediately feel a wave of dread because I\u2019ve disrupted my own routines or created unpredictability I can\u2019t tolerate."},
    {id:"1.4",text:"My mind jumps between many thoughts at once, but I\u2019m simultaneously rigid about how those thoughts should be organized, categorized, or resolved \u2014 and the combination means I rarely feel finished with anything."},
    {id:"1.5",text:"I oscillate between craving social connection (sometimes desperately) and feeling overwhelmed the moment I have it, leaving me feeling like I don\u2019t truly belong in either state \u2014 alone or together."},
  ]},
  {id:2,title:"The Invisible Labor of Looking Normal",hasNA:false,items:[
    {id:"2.1",text:"I have a highly developed internal library of scripts, responses, and social moves that I draw from in conversation \u2014 and I am aware, in real time, that I am performing rather than simply being, even when I appear natural or charismatic to others."},
    {id:"2.2",text:"After social interactions that others would describe as fun or successful, I need significant alone time to recover \u2014 not because I prefer solitude, but because I\u2019ve been running a complex, exhausting internal translation process the entire time."},
    {id:"2.3",text:"I have spent so many years studying what \u201cnormal\u201d looks like that I can pass as competent, warm, and organized in professional settings while privately having no idea how other people do this effortlessly."},
    {id:"2.4",text:"When my composure slips \u2014 during illness, exhaustion, or overwhelm \u2014 I feel profound shame disproportionate to what actually happened, as if my \u201creal\u201d self has been exposed as fundamentally defective."},
    {id:"2.5",text:"I genuinely cannot always tell whether my preferences, opinions, and personality traits are authentically mine or whether they are performances I\u2019ve adopted so successfully I\u2019ve forgotten the original."},
  ]},
  {id:3,title:"How Your Hormones Shape Your Experience",hasNA:true,items:[
    {id:"3.1",text:"If you have a menstrual cycle: In the 7\u201310 days before my period, my ability to hold myself together, organize my thoughts, tolerate sensory input, and manage my emotions deteriorates so significantly that it feels like a complete internal system breakdown."},
    {id:"3.2",text:"If you have experienced postpartum or major hormonal changes (e.g., starting/stopping birth control): I experienced a sudden and dramatic increase in anxiety, sensory overwhelm, rigidity, or an inability to function that felt qualitatively different from anything I\u2019d known before."},
    {id:"3.3",text:"If you are approaching or moving through perimenopause or menopause: I notice that coping strategies that worked for decades are suddenly failing \u2014 and an internal chaos I could previously contain is becoming harder to hide from others and from myself."},
    {id:"3.4",text:"If you have a cycle or track your hormonal shifts: My ability to concentrate, control impulses, and initiate tasks feels measurably worse at specific, predictable points in my cycle or hormonal state."},
    {id:"3.5",text:"If you experience hormonal fluctuations: I have wondered whether a hormonal condition was the \u201creal\u201d explanation for my struggles \u2014 only to notice that the same struggles persist, in milder form, even in the windows when my hormones are stable."},
  ]},
  {id:4,title:"Emotional Architecture",hasNA:false,items:[
    {id:"4.1",text:"Criticism \u2014 even mild, well-intentioned feedback \u2014 can produce an emotional reaction in me that feels physically painful and completely disproportionate, and I often cannot talk myself out of it no matter how clearly I understand intellectually that it is not catastrophic."},
    {id:"4.2",text:"I frequently experience strong emotions during an event but only fully understand what I was feeling \u2014 and why \u2014 hours or days later, when it\u2019s too late to respond authentically in the moment."},
    {id:"4.3",text:"I can appear calm, measured, or even detached during emotionally charged situations, then experience a delayed collapse \u2014 total physical exhaustion, tears, or an outburst \u2014 in private once I reach safety."},
    {id:"4.4",text:"The fear of getting something wrong, being perceived as \u201ctoo much,\u201d or accidentally breaking an unspoken social rule is so ever-present that it functions as a low-grade hum of dread that rarely fully quiets, even when things are objectively fine."},
    {id:"4.5",text:"When I am in emotional overwhelm, I simultaneously feel the emotion with overwhelming intensity and feel completely detached from it \u2014 as if watching myself from outside my own body \u2014 making it nearly impossible to reach out or regulate in the moment."},
  ]},
];

const LK=[{v:1,l:"Never"},{v:2,l:"Rarely"},{v:3,l:"Sometimes"},{v:4,l:"Often"},{v:5,l:"Always"}];
const TOTAL=CATS.reduce((s,c)=>s+c.items.length,0);

function getAns(r){let n=0;CATS.forEach(c=>c.items.forEach(it=>{if(r[it.id]!==undefined)n++;}));return n;}

function buildEmailBody(res){
  const domLabels={adhd:"ADHD-Dominant Processing Profile",autistic:"Autistic-Dominant Processing Profile",balanced:"Balanced Processing Profile"};
  const domText={
    adhd:"Your core, dopamine-driven impulse for novelty, action, and new ideas is frequently paralyzed or trapped by a need for perfection, order, and exact environmental rightness.",
    autistic:"Your deep, fundamental need for structure, predictability, and specialization is routinely sabotaged from the inside out by impulsivity, distraction, and dopamine-seeking.",
    balanced:"Both neurological forces operate with equal strength simultaneously, creating a continuous state of volatile friction."
  };
  let t="FLOURISH AuDHD SCREENING RESULTS\n";
  t+="================================\n\n";
  t+="IMPORTANT: This is an informal screening tool, not a diagnostic instrument.\n";
  t+="A formal diagnosis requires evaluation by a qualified healthcare provider.\n\n";
  t+="TOTAL INTERSECTIONAL SIGNAL: "+res.pct+"%\n\n";
  t+="DOMAIN SCORES:\n";
  res.cats.forEach(c=>{t+="  "+c.title+": "+(c.mx>0?c.pct+"%":"N/A")+"\n";});
  t+="\nPROCESSING DOMINANCE PROFILE:\n";
  t+=domLabels[res.dom]+"\n";
  t+=domText[res.dom]+"\n\n";
  t+="CLINICAL INSIGHTS:\n";
  t+="- The Camouflage & Identity Layer: Camouflaging is not a single layer. It is social camouflage running on top of ADHD compensatory strategies, running on top of decades of gendered conditioning.\n\n";
  if(res.horm)t+="- Hormonal Axis Alert: Your traits appear heavily tied to your biology. Drops in estrogen directly deplete dopamine and serotonin, stripping away your brain's protective buffer.\n\n";
  if(res.bpd)t+="- Differential Consideration: The combination of intense emotional reactivity and delayed private collapse is historically linked to misdiagnosis of BPD or complex PTSD in women.\n\n";
  if(res.burn)t+="- Burnout Indicator: Uncertainty about which aspects of yourself are authentic is a clinical indicator of deep burnout from prolonged camouflaging.\n\n";
  t+="- The Connective Tissue & Autonomic Nexus: This neurotype has high statistical overlap with POTS, EDS/Hypermobility, and MCAS. Consider exploring these with a neurodivergent-affirming provider.\n\n";
  t+="---\nGenerated by FLOURISH AuDHD Screening Tool\n(C) 2026 FLOURISH | All rights reserved\nFLOURISH: Integrative Therapy for Those Who Want to Cultivate a Life They Love";
  return t;
}

function calcR(r){
  let tot=0,pos=0;
  CATS.forEach(c=>c.items.forEach(it=>{const v=r[it.id];if(v&&v!=="NA"){tot+=v;pos+=5;}}));
  const pct=pos>0?Math.round(tot/pos*100):0;
  const s11=(r["1.1"]!=="NA"&&r["1.1"])||0,s12=(r["1.2"]!=="NA"&&r["1.2"])||0;
  const s11b=(r["1.1b"]!=="NA"&&r["1.1b"])||0,s12b=(r["1.2b"]!=="NA"&&r["1.2b"])||0;
  const as=s11+s12,ats=s11b+s12b;
  let dom=Math.abs(as-ats)<=1?"balanced":as>ats?"adhd":"autistic";
  const horm=CATS[2].items.some(it=>{const v=r[it.id];return v&&v!=="NA"&&v>=4;});
  const bpd=r["4.1"]>=4&&r["4.3"]>=4,burn=r["2.5"]>=4;
  const cats=CATS.map(c=>{let sc=0,mx=0;c.items.forEach(it=>{const v=r[it.id];if(v&&v!=="NA"){sc+=v;mx+=5;}});return{title:c.title,sc,mx,pct:mx>0?Math.round(sc/mx*100):0};});
  return{tot,pos,pct,dom,horm,bpd,burn,cats};
}

function QItem({item,hasNA,val,onChange}){
  const cols=hasNA?"repeat(5,1fr) 0.8fr":"repeat(5,1fr)";
  return e("div",{className:"qi"},
    e("p",{style:{fontSize:"0.91rem",lineHeight:1.76,color:"#2d3748",marginBottom:"11px",textAlign:"left"}},item.text),
    e("div",{style:{display:"grid",gridTemplateColumns:cols,gap:"6px",width:"100%"}},
      LK.map(o=>e("button",{key:o.v,className:"likert-btn"+(val===o.v?" sel":""),onClick:()=>onChange(item.id,o.v)},
        e("div",{style:{fontWeight:700,fontSize:"1rem",marginBottom:"1px"}},o.v),
        e("div",{style:{fontSize:"0.63rem"}},o.l)
      )),
      hasNA&&e("button",{className:"likert-btn na"+(val==="NA"?" sel":""),onClick:()=>onChange(item.id,"NA")},
        e("div",{style:{fontWeight:700,fontSize:"0.82rem",marginBottom:"1px"}},"N/A"),
        e("div",{style:{fontSize:"0.6rem"}},"Not applicable")
      )
    )
  );
}

function SBar({label,sc,mx,color}){
  const p=mx>0?Math.round(sc/mx*100):0;
  return e("div",{style:{marginBottom:"10px"}},
    e("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"0.79rem",fontFamily:"Raleway,sans-serif",color:"#4a7c59",fontWeight:600,marginBottom:"3px"}},e("span",null,label),e("span",null,mx>0?p+"%":"N/A")),
    e("div",{className:"rbb"},e("div",{className:"rbf",style:{width:(mx>0?p:0)+"%",background:color}}))
  );
}

function FCard({icon,color,title,children}){
  return e("div",{className:"fcard",style:{borderColor:color||"#4a7c59"}},
    e("div",{style:{display:"flex",gap:"9px",alignItems:"flex-start"}},
      e("span",{style:{fontSize:"1rem",marginTop:"1px",flexShrink:0}},icon),
      e("div",null,
        e("div",{className:"slbl",style:{color:color||"#4a7c59",marginBottom:"6px"}},title),
        e("p",{style:{fontSize:"0.86rem",lineHeight:1.8,color:"#2d3748",textAlign:"left"}},children)
      )
    )
  );
}

function Results({res,onReset}){
  const [showEmail,setShowEmail]=useState(false);
  const [emailAddr,setEmailAddr]=useState("");
  const [sent,setSent]=useState(false);

  const dc={
    adhd:{label:"ADHD-Dominant Processing Profile",color:"#4CAF50",body:"Your core, dopamine-driven impulse for novelty, action, and new ideas is frequently paralyzed or trapped by a need for perfection, order, and exact environmental rightness. You want to move, but an internal emergency brake locks you in place."},
    autistic:{label:"Autistic-Dominant Processing Profile",color:"#013220",body:"Your deep, fundamental need for structure, predictability, routine, and specialization is routinely sabotaged, disrupted, and shattered from the inside out by impulsivity, distraction, time-blindness, and a desperate pursuit of dopamine."},
    balanced:{label:"Balanced Processing Profile",color:"#4a7c59",body:"Both neurological forces operate with equal, intense strength simultaneously. You live in a continuous state of volatile friction \u2014 meticulously planning systems only to immediately break them, leaving you profoundly exhausted because neither side ever fully wins."},
  }[res.dom];

  const sc=res.pct>=70?"#013220":res.pct>=45?"#4CAF50":"#7ec850";

  function doEmail(){
    if(!emailAddr.trim())return;
    const body=buildEmailBody(res);
    const subject=encodeURIComponent("My FLOURISH AuDHD Screening Results");
    const bodyEnc=encodeURIComponent(body);
    window.location.href="mailto:"+emailAddr.trim()+"?subject="+subject+"&body="+bodyEnc;
    setSent(true);
    setTimeout(()=>setSent(false),4000);
  }

  return e("div",{className:"fade-in"},
    e("div",{className:"print-header"},
      e("h2",{style:{fontFamily:"Raleway,sans-serif",color:"#4a7c59",fontSize:"1.4rem",marginBottom:"4px"}},"FLOURISH AuDHD Screening Results"),
      e("p",{style:{fontSize:"0.78rem",color:"#6a8a6b"}},"This is an informal screening tool, not a diagnostic instrument.")
    ),
    e("div",{style:{background:"#4a7c59",color:"#fff",padding:"22px",textAlign:"center",marginBottom:"20px",borderRadius:"5px"}},
      e("h2",{style:{fontFamily:"Raleway,sans-serif",fontSize:"1.45rem",fontWeight:700,marginBottom:"4px",color:"#fff"}},"Your Screening Profile"),
      e("p",{style:{fontSize:"0.85rem",opacity:0.85}},"Review your results and share with your provider.")
    ),
    e("div",{className:"card",style:{marginBottom:"18px"}},
      e("h3",{style:{fontSize:"0.95rem",color:"#013220",marginBottom:"10px"}},"Total Intersectional Signal"),
      e("div",{style:{fontFamily:"Raleway,sans-serif",fontSize:"2.6rem",fontWeight:700,color:sc,marginBottom:"6px"}},res.pct+"%"),
      e("p",{style:{fontSize:"0.85rem",lineHeight:1.75,color:"#2d3748",textAlign:"left"}},
        res.pct>=70?"A high signal score reflects a highly active, deeply internalized dual neurotype that expends immense daily cognitive energy to remain functional and composed. This is not a measure of severity \u2014 it is a measure of how hard your system has been working, largely invisibly, for a very long time.":
        res.pct>=45?"A moderate signal suggests meaningful dual-processing dynamics are present. Your internal friction is real, even if it has not yet reached a crisis point. This warrants a thoughtful conversation with a clinician experienced in late-identified neurodivergence in women.":
        "A lower signal score does not rule out underlying dynamics \u2014 highly developed coping strategies and deep conditioning can suppress honest self-reporting. Consider discussing these patterns with a clinician even if they feel partial or inconsistent."
      )
    ),
    e("div",{className:"card",style:{marginBottom:"18px"}},
      e("h3",{style:{fontSize:"0.95rem",color:"#013220",marginBottom:"12px"}},"Domain Breakdown"),
      res.cats.map((c,i)=>e(SBar,{key:i,label:c.title,sc:c.sc,mx:c.mx,color:["#4a7c59","#4CAF50","#7ec850","#013220"][i]}))
    ),
    e("div",{className:"card",style:{marginBottom:"18px",borderColor:dc.color}},
      e("div",{className:"slbl",style:{color:dc.color,marginBottom:"7px"}},"Processing Dominance Profile"),
      e("div",{style:{display:"inline-block",padding:"4px 12px",borderRadius:"20px",background:dc.color+"18",border:"1px solid "+dc.color,marginBottom:"9px",fontFamily:"Raleway,sans-serif",fontWeight:600,fontSize:"0.83rem",color:dc.color}},dc.label),
      e("p",{style:{fontSize:"0.87rem",lineHeight:1.8,color:"#2d3748",textAlign:"left"}},dc.body)
    ),
    e("div",{style:{marginBottom:"8px"}},
      e("h3",{style:{fontSize:"0.95rem",color:"#013220",marginBottom:"12px"}},"Deep-Dive Insights for You and Your Provider"),
      e(FCard,{icon:"\u25CE",title:"The Camouflage & Identity Layer \u2014 Always Present"},"Camouflaging in this joint neurotype is not a single layer. It is social camouflage running on top of ADHD compensatory strategies, running on top of decades of gendered conditioning. The cost is completely invisible to the outside world, frequently leading to late-stage burnout or identity confusion \u2014 and is one of the primary reasons this profile is diagnosed so late in women."),
      res.horm&&e(FCard,{icon:"\u26A1",color:"#3e8e41",title:"Hormonal Axis Alert"},"Your traits appear heavily tied to your biology. Drops in estrogen \u2014 during the luteal phase, postpartum, or perimenopause \u2014 directly deplete dopamine and serotonin, stripping away your brain\u2019s protective buffer. This collapses your ability to cope, causing sudden sensory overwhelm and executive failure that is frequently misdiagnosed as purely hormonal mood disorders rather than a neurobiological unmasking event."),
      res.bpd&&e(FCard,{icon:"\u26A0",color:"#c87d5a",title:"Differential Consideration \u2014 Emotional Intensity Pattern"},"The combination of intense emotional reactivity and delayed private collapse is a pattern historically linked to misdiagnosis of Borderline Personality Disorder or complex PTSD in women. Your emotional baseline is not a character defect \u2014 it is the lived architecture of a nervous system processing emotion with atypical intensity and an autistic delay. If BPD has ever been raised as a diagnosis, please discuss this profile explicitly with your provider."),
      res.burn&&e(FCard,{icon:"\u26A0",color:"#c8a86b",title:"Burnout Indicator \u2014 Identity Dissolution Warning"},"Uncertainty about which aspects of yourself are authentic versus performed is a clinical indicator of deep burnout from prolonged camouflaging. When the performance has been sustained long enough, it begins to feel like identity. The inability to locate an unperformed self is one of the most distressing \u2014 and least discussed \u2014 consequences of late recognition. Please raise this explicitly with your provider."),
      e(FCard,{icon:"\u25C8",title:"The Connective Tissue & Autonomic Nervous System Nexus \u2014 Always Present"},"It is critical to note that this specific female neurotype has an incredibly high statistical overlap with systemic physical conditions. If you experience unexplained physical exhaustion, dizziness upon standing, chronic joint pain, or intense flushing, consider exploring POTS, EDS/Hypermobility (Ehlers-Danlos Syndrome), and MCAS (Mast Cell Activation Syndrome) with a neurodivergent-affirming medical professional. These are not separate issues \u2014 they are heavily linked to your nervous system\u2019s architecture.")
    ),
    e("div",{className:"action-row no-print"},
      e("button",{className:"cta",onClick:()=>window.print()},"\u2399 Print / Save as PDF"),
      e("button",{className:"cta",onClick:()=>setShowEmail(s=>!s),style:{background:showEmail?"#3e8e41":"#4CAF50"}},"\u2709 Email My Results"),
      e("button",{className:"cta-outline",onClick:onReset},"Start Over")
    ),
    showEmail&&e("div",{className:"email-panel no-print"},
      e("p",{style:{fontFamily:"Raleway,sans-serif",fontWeight:600,fontSize:"0.85rem",color:"#013220",marginBottom:"8px"}},"Send results to yourself or your provider"),
      e("p",{style:{fontSize:"0.8rem",color:"#6a8a6b",marginBottom:"12px",lineHeight:1.6}},"Enter an email address below. Your results will open in your email app, ready to send. No data is stored or transmitted by this tool."),
      e("div",{style:{display:"flex",gap:"8px",flexWrap:"wrap"}},
        e("input",{
          type:"email",className:"email-input",
          placeholder:"Enter email address...",
          value:emailAddr,
          onChange:ev=>setEmailAddr(ev.target.value),
          onKeyDown:ev=>{if(ev.key==="Enter")doEmail();},
          style:{flex:1,minWidth:"200px"}
        }),
        e("button",{className:"cta",onClick:doEmail,style:{background:sent?"#013220":"#4CAF50",flexShrink:0}},sent?"\u2713 Opening email app...":"Send")
      )
    )
  );
}

function App(){
  const [resp,setResp]=useState({});
  const [res,setRes]=useState(null);
  const [cat,setCat]=useState(0);
  const resRef=useRef(null);
  const topRef=useRef(null);

  const ans=getAns(resp);
  const prog=Math.round(ans/TOTAL*100);
  const allDone=ans===TOTAL;
  const cc=CATS[cat];
  const cAns=cc.items.filter(it=>resp[it.id]!==undefined).length;
  const cPct=Math.round(cAns/cc.items.length*100);

  function chg(id,v){setResp(p=>({...p,[id]:v}));}
  function calc(){const r=calcR(resp);setRes(r);setTimeout(()=>resRef.current?.scrollIntoView({behavior:"smooth",block:"start"}),120);}
  function reset(){setResp({});setRes(null);setCat(0);setTimeout(()=>topRef.current?.scrollIntoView({behavior:"smooth"}),80);}

  return e("div",{style:{background:"#f7fbf4",minHeight:"100vh"}},
    e("div",{ref:topRef,style:{background:"#4a7c59",padding:"20px 22px",textAlign:"center"}},
      e("h1",{style:{fontFamily:"Raleway,sans-serif",color:"#fff",fontSize:"clamp(1.1rem,3.2vw,1.75rem)",fontWeight:700,letterSpacing:"0.05em"}},
        "AuDHD Screening Tool for Women")
    ),
    e("div",{style:{maxWidth:"760px",margin:"0 auto",padding:"18px 14px 0"}},
      e("div",{className:"nbox"},
        e("p",{style:{fontFamily:"Raleway,sans-serif",fontWeight:700,fontSize:"0.78rem",color:"#013220",letterSpacing:"0.06em",marginBottom:"4px"}},"\u26A0 CRITICAL NOTICE"),
        e("p",{style:{fontSize:"0.84rem",lineHeight:1.7,color:"#2d3748",textAlign:"left"}},"This is an informal screening tool, NOT a clinical or diagnostic instrument. A formal diagnosis requires a comprehensive evaluation by a qualified healthcare provider.")
      ),
      e("div",{className:"nbox"},
        e("p",{style:{fontFamily:"Raleway,sans-serif",fontWeight:700,fontSize:"0.78rem",color:"#013220",letterSpacing:"0.06em",marginBottom:"4px"}},"WHAT THIS TOOL DOES"),
        e("p",{style:{fontSize:"0.84rem",lineHeight:1.7,color:"#2d3748",textAlign:"left"}},"This tool is designed to analyze how your traits interact with each other \u2014 not just measure them in isolation. Your results will include a profile showing whether your internal friction leans Autistic-Dominant, ADHD-Dominant, or a Balanced blend of both.")
      )
    ),
    e("div",{style:{maxWidth:"760px",margin:"0 auto",padding:"14px 14px 80px"}},
      !res&&e("div",null,
        e("div",{style:{marginBottom:"16px"}},
          e("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"0.74rem",color:"#6a8a6b",fontFamily:"Raleway,sans-serif",marginBottom:"4px"}},
            e("span",null,"Overall Progress"),e("span",null,ans+" of "+TOTAL+" answered ("+prog+"%)")
          ),
          e("div",{className:"pb"},e("div",{className:"pbf",style:{width:prog+"%"}}))
        ),
        e("div",{style:{display:"flex",gap:"5px",marginBottom:"16px",overflowX:"auto",paddingBottom:"2px"}},
          CATS.map((c,i)=>{
            const done=c.items.filter(it=>resp[it.id]!==undefined).length===c.items.length;
            return e("button",{key:c.id,className:"tbtn",onClick:()=>setCat(i),style:{
              padding:"7px 12px",fontSize:"0.73rem",fontWeight:600,borderRadius:"5px",whiteSpace:"nowrap",
              background:cat===i?"#4a7c59":"#fff",color:cat===i?"#fff":"#4a7c59",
              border:"1px solid "+(cat===i?"#013220":"#b0cfa8"),
            }},(done?"\u2713 ":"")+"Part "+(i+1));
          })
        ),
        e("div",{className:"card fade-in",key:cat},
          e("div",{style:{marginBottom:"16px"}},
            e("div",{className:"slbl"},"Section "+(cat+1)+" of "+CATS.length),
            e("h3",{style:{fontSize:"1.1rem",fontWeight:700,color:"#013220",marginBottom:"7px"}},cc.title),
            e("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"0.73rem",color:"#6a8a6b",marginBottom:"3px"}},
              e("span",null,cAns+" of "+cc.items.length+" answered"),e("span",null,cPct+"%")
            ),
            e("div",{className:"pb"},e("div",{className:"pbf",style:{width:cPct+"%"}}))
          ),
          cc.items.map(it=>e(QItem,{key:it.id,item:it,hasNA:cc.hasNA,val:resp[it.id],onChange:chg}))
        ),
        e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"8px"}},
          cat>0?e("button",{className:"cta-outline",onClick:()=>setCat(cat-1)},"\u2190 Previous"):e("div"),
          cat<CATS.length-1
            ?e("button",{className:"cta",onClick:()=>setCat(cat+1)},"Next Section \u2192")
            :e("button",{className:"cta",disabled:!allDone,onClick:allDone?calc:null,style:{opacity:allDone?1:0.6}},
                allDone?"Calculate My Results \u2726":(TOTAL-ans)+" remaining")
        )
      ),
      res&&e("div",{ref:resRef},e(Results,{res,onReset:reset}))
    ),
    e("div",{className:"sfoot"},
      e("div",{className:"sfoot-in"},
        e("div",{style:{display:"flex",alignItems:"center",gap:"9px",flex:1,minWidth:0}},
          e("img",{src:LOGO_SRC,alt:"Flourish",style:{width:"32px",height:"32px",objectFit:"contain",flexShrink:0}}),
          e("p",{style:{fontSize:"0.76rem",color:"#2d3748",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",fontFamily:"Lato,sans-serif"}},
            "FLOURISH: Integrative Therapy for Those Who Want to Cultivate a Life They Love")
        ),
        e("p",{style:{fontSize:"0.7rem",color:"#888",flexShrink:0,marginLeft:"10px",fontFamily:"Lato,sans-serif"}},
          "\u00A9 2026 FLOURISH | All rights reserved")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
